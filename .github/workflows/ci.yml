name: CI - Build & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-backend:
    name: Lint & Build - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Rodar Lint do Backend
        working-directory: server
        run: npm run lint

  lint-frontend:
    name: Lint - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Rodar Lint do Frontend
        run: htmlhint "game/**/*.html" --config .htmlhintrc

  test-backend:
    name: Testes Unitários - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Rodar Testes Unitários
        working-directory: server
        run: npm test

  fuzz-backend:
    name: Testes de Fuzzing - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Rodar Testes de Fuzzing
        working-directory: server
        run: npx jest fuzz.test.js

  sca-security:
    name: SCA - Verificação de Dependências
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Rodar SCA com npm audit
        working-directory: server
        run: npm audit --audit-level=critical

  sast-security:
    name: SAST - Análise Estática de Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar SAST com njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: './server --sarif --output results.sarif || true'

      - name: Publicar resultados SAST
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif