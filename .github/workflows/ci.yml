# =============================================================
# Fase 3 - CI: Build & Lint
# Pipeline que roda automaticamente a cada push ou pull request
# Falha se o lint encontrar erros no frontend ou backend
# =============================================================

name: CI - Build & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------
  # Job 1: Lint e Build do Backend (Node.js)
  # -----------------------------------------------------------
  lint-backend:
    name: Lint & Build - Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Rodar Lint do Backend
        working-directory: server
        run: npm run lint

  # -----------------------------------------------------------
  # Job 2: Lint do Frontend (HTMLHint)
  # -----------------------------------------------------------
  lint-frontend:
    name: Lint - Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Rodar Lint do Frontend
        run: htmlhint "game/**/*.html" --config .htmlhintrc
